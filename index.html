<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Enjoy Cats Panic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Reggae+One&family=Yusei+Magic&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh; 
            overflow: hidden; 
            touch-action: none; 
        }

        #mainWrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 15px;
            box-sizing: border-box;
            padding: 10px;
        }

        #leftPanel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 130px;
            text-align: center;
        }

        #rightPanel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100px;
        }

        #uiTitle {
            margin: 0 0 20px 0; font-size: 26px;
            font-family: 'Dela Gothic One', 'Reggae One', sans-serif;
            letter-spacing: 1px; line-height: 1.2; color: #5599ff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #uiDesc { margin: 0; font-size: 13px; font-weight: bold; line-height: 1.8; color: #ddd; }

        .statBox {
            background-color: rgba(0, 0, 0, 0.6); 
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 8px;
            padding: 8px 5px; margin-bottom: 12px; width: 100%;
            text-align: center; box-sizing: border-box;
        }
        .statLabel { font-size: 12px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        .statValue { font-size: 18px; font-weight: bold; color: #fff; }
        .statTime { color: #ffd700; }

        #gameContainer {
            position: relative; display: flex; justify-content: center; align-items: center;
        }

        canvas {
            background-color: #000; border: 2px solid #555; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: block;
            max-width: calc(100vw - 280px); 
            max-height: 94dvh; 
            width: auto; height: auto;
            aspect-ratio: 4 / 3; object-fit: contain;
        }
        
        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); /* 背景をより暗くして見やすく */
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; cursor: pointer; color: white; text-align: center;
        }
        #startScreen h1 { font-size: 48px; margin: 0 0 10px 0; color: #5599ff; font-family: 'Dela Gothic One', sans-serif; }
        #startScreen p { font-size: 24px; animation: blink 1.5s infinite; font-weight: bold; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ★修正: 免責事項のフォントサイズを半分の6px相当に（スマホでは最小10px前後で描画されることが多いので極小指定） */
        #disclaimer { margin-top: 30px; font-size: 8px; color: #888; line-height: 1.4; font-weight: normal; animation: none; padding: 0 10px; }
        #gameDescLink { margin-top: 20px; font-size: 18px; color: #ffcc00; text-decoration: none; border: 2px solid #ffcc00; padding: 10px 25px; border-radius: 8px; background: rgba(0, 0, 0, 0.5); transition: all 0.3s; font-family: sans-serif; z-index: 101; }
        
        #subscribeLink {
            display: none; position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            font-size: 18px; color: #fff; text-decoration: none; border: 2px solid #ff0000;
            padding: 8px 25px; border-radius: 8px; background: rgba(204, 0, 0, 0.8);
            z-index: 101; font-weight: bold;
        }

        /* 十字キーの基本設定（JavaScriptで動的にクラスを付け替えてスタイルを変更します） */
        #dpadContainer {
            position: fixed; 
            border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 200; touch-action: none; cursor: pointer;
            background-image: linear-gradient(0deg, transparent 49%, rgba(255,255,255,0.15) 49%, rgba(255,255,255,0.15) 51%, transparent 51%), linear-gradient(90deg, transparent 49%, rgba(255,255,255,0.15) 49%, rgba(255,255,255,0.15) 51%, transparent 51%);
            transition: all 0.2s ease-out; /* サイズや位置変更時のアニメーション */
        }
        #dpadCenter {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30%; height: 30%; background: rgba(100, 150, 255, 0.8); border-radius: 50%;
            pointer-events: none;
        }

        /* 十字キーの状態クラス群 */
        .dpad-small { width: 120px; height: 120px; }
        .dpad-large { width: 240px; height: 240px; }
        .dpad-right { bottom: 15px; right: 15px; left: auto; transform: none; }
        .dpad-left { bottom: 15px; left: 15px; right: auto; transform: none; }
        .dpad-center { bottom: 15px; left: 50%; right: auto; transform: translateX(-50%); }

        /* ★修正: 縦向き用のレイアウト改善 */
        @media (orientation: portrait) {
            /* 全体を上部に寄せる */
            #mainWrapper { flex-direction: column; justify-content: flex-start; padding-top: 5dvh; gap: 10px; }
            
            #leftPanel { width: 100%; flex-direction: row; justify-content: center; margin-bottom: 0; }
            #rightPanel { width: 98%; flex-direction: row; justify-content: space-evenly; gap: 5px; margin-top: 0; }
            
            #uiTitle { font-size: 20px; line-height: 1.2; margin: 0; text-align: center; display: flex; gap: 10px; }
            /* 縦向き時はタイトルを1行で横並びにする（Enjoy Cats Panic） */
            #uiTitle br { display: none; }
            #uiDesc { display: none; } 
            
            .statBox { margin-bottom: 0; padding: 4px; border-width: 1px; width: 23%; }
            .statLabel { font-size: 10px; margin-bottom: 2px; }
            .statValue { font-size: 14px; }
            
            canvas {
                max-width: 98vw;
                max-height: 50dvh; 
            }

            /* 縦向き時のスタート画面内の重なりを防止 */
            #startScreen { background: #222; } /* 透けさせず完全な背景色に */
            #startScreen h1 { font-size: 36px; margin-top: -50px; }
            #startScreen p { font-size: 18px; }
            #gameDescLink { font-size: 14px; padding: 8px 16px; margin-top: 15px; }
            #disclaimer { margin-top: 20px; }
        }
    </style>
</head>
<body>
    <div id="mainWrapper">
        <div id="leftPanel">
            <h1 id="uiTitle">Enjoy<br>Cats<br>Panic</h1>
            <p id="uiDesc"></p>
        </div>
        
        <div id="gameContainer">
            <div id="startScreen">
                <h1 id="startTitle">Enjoy Cats Panic</h1>
                <p id="startMsg">画面をクリックして戦闘開始！</p>
                <a href="https://youtube.com/@enjoy-battlecats" target="_blank" id="gameDescLink">ゲーム説明はこちら</a>
                <p id="disclaimer">
                    <!-- ★修正: 「ファンによる」を削除 -->
                    ※本作は非公式の二次創作ゲームであり、ポノス株式会社様および「にゃんこ大戦争」公式とは一切関係ありません。<br>
                    *This is an unofficial fan-made game and is not affiliated with PONOS Corp. or the official "The Battle Cats".
                </p>
            </div>

            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <a href="https://www.youtube.com/@enjoy-battlecats?sub_confirmation=1" target="_blank" id="subscribeLink">チャンネル登録はこちら</a>
            
            <audio id="bgm" preload="auto"></audio>
            <audio id="audioStart" preload="auto"></audio>
            <audio id="audioClear" preload="auto"></audio>
            <audio id="audioGameOver" preload="auto"></audio>
            <audio id="audioAllClear" preload="auto"></audio>
            <audio id="audioCapture" preload="auto"></audio> 
            <audio id="audioShock" preload="auto"></audio> 
        </div>

        <div id="rightPanel">
            <div class="statBox"><div id="uiStage" class="statLabel">Stage</div><div id="stageDisplay" class="statValue">01</div></div>
            <div class="statBox"><div id="uiArea" class="statLabel">Area</div><div class="statValue"><span id="areaDisplay">0</span>%</div></div>
            <div class="statBox"><div id="uiGoal" class="statLabel">Goal</div><div class="statValue"><span id="goalDisplay">75</span>%</div></div>
            <div class="statBox"><div id="uiTime" class="statLabel">Time</div><div id="timeDisplay" class="statValue statTime">00:00</div></div>
        </div>

        <!-- ★修正: 初期状態のクラスを付与 (右下・小) -->
        <div id="dpadContainer" class="dpad-small dpad-right">
            <div id="dpadCenter"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
